[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "noesis-learning"
version = "0.1.0"
description = "Local-first, AI-assisted Anki-style spaced repetition for Hermes Agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic==1.19.2",
  "fsrs==6.3.2",
  "mcp==2.2.0",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.52",
  "typer==0.21.0",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "httpx2==2.12.0",
  "psycopg==3.3.4; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0"]

[project.scripts]
noesis = "noesis.cli.app:app"
noesis-web = "noesis.web.app:main"
noesis-mcp-http = "noesis.mcp.http:main"
noesis-admin = "noesis.cli.admin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

