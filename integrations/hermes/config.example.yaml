mcp_servers:
  noesis:
    command: "/srv/noesis/bin/noesis-mcp"
    args: []
    supports_parallel_tool_calls: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
    tools:
      include:
        - propose_capture
        - commit_capture
        - start_review
        - submit_attempt
        - resolve_learning_issue
        - update_learning_state
        - recall_context
        - get_progress
      prompts: false
      resources: false

