name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest --cov=noesis --cov-report=term-missing
      - name: Validate migrations
        run: |
          export NOESIS_DB_PATH="$RUNNER_TEMP/migration.db"
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
          uv run --frozen alembic downgrade base
      - run: uv build

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts
        run: |
          bash -n deploy/install.sh deploy/update.sh deploy/noesis-mcp deploy/noesis-admin
          python3 -m py_compile deploy/mcp-smoke.py
          test ! -e deploy/noesis.service
